name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TRIVY_VERSION: "0.74.0"
  TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
  TRIVY_DISABLE_VEX_NOTICE: "true"

jobs:
  release:
    runs-on: ubuntu-latest
    # holds the signing secrets, only allowed for v* tags
    environment: Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # outside the workspace: goreleaser fails on a dirty git tree
      - name: extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v version="${TAG#v}" '
            /^## / { if (found) exit; found = ($2 == version); next }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "CHANGELOG.md has no notes for $TAG" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"

      # goreleaser would upload into a published release before trivy runs
      - name: check release is not published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            echo "release $TAG is already published" >&2
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x" # newest patch release; go.mod only sets the minimum
          check-latest: true
          cache: false # no cache from other runs in the signing job

      - name: test
        run: go test -race ./...

      # syft, used by goreleaser for SBOMs
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # plain gpg so no third-party action sees the key
      - name: import gpg key
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          fpr=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')
          if [ -z "$fpr" ]; then
            echo "no secret key imported; check the GPG_PRIVATE_KEY secret" >&2
            exit 1
          fi
          echo "fingerprint=$fpr" >> "$GITHUB_OUTPUT"

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.2
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
          GPG_PASSPHRASE: ${{ secrets.PASSPHRASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: remove gpg key
        if: always()
        run: |
          gpgconf --kill gpg-agent
          rm -rf "$HOME/.gnupg"

      - name: install trivy
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -sSfL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz -C "$RUNNER_TEMP/bin" trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # all archives have the same Go modules, so one SBOM is enough
      - name: trivy scan
        working-directory: ${{ github.workspace }}
        run: |
          sbom=$(ls dist/*_linux_amd64.zip.sbom.json)
          echo "scanning $sbom"
          trivy sbom --scanners vuln --format json -o trivy.json "$sbom"
          trivy convert --format table trivy.json > trivy-report.txt
          # convert prints nothing when clean
          if [ ! -s trivy-report.txt ]; then
            echo "No vulnerabilities found." > trivy-report.txt
          fi
          cat trivy-report.txt

      - name: attach report to release
        if: always() && hashFiles('trivy-report.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo '## Trivy scan'
            echo '```'
            cat trivy-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          gh release upload "$TAG" trivy-report.txt --clobber

      # failing here deletes the draft, so nothing is published
      - name: fail on critical vulnerabilities
        run: trivy convert --exit-code 1 --severity CRITICAL --format table trivy.json

      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false

      - name: delete draft release
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$TAG" --yes
          fi
